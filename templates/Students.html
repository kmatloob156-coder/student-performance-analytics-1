{% extends "base.html" %}

{% block content %}

<div class="container">
    <h2>All Students</h2>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Marks</th>
                    <th>Attendance</th>
                    <th>Grade</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                {% for s in students %}
                {% set student_id = loop.index0 %}

                <tr>
                    <td>{{ loop.index }}</td>

                    <td>{{ s.name }}</td>

                    <td>{{ s.marks }}</td>

                    <td>{{ s.attendance }}%</td>

                    <td>
                        {{ grade(s.marks) }}
                    </td>

                    <td>

                        <!-- EDIT BUTTON -->
                        <a href="{{ url_for('edit_student', student_id=student_id) }}"
                           class="edit-btn">
                            ✏️ Edit
                        </a>

                        <!-- DELETE BUTTON -->
                        <form action="{{ url_for('delete_student', student_id=student_id) }}"
                              method="POST"
                              style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to delete this student?');">

                            <button type="submit" class="delete-btn">
                                🗑️ Delete
                            </button>

                        </form>

                    </td>
                </tr>

                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<style>

.container {
    width: 95%;
    margin: auto;
}

.table-container {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
}

th {
    background: #f2f2f2;
}

.edit-btn,
.delete-btn {
    padding: 7px 10px;
    margin: 2px;
    border-radius: 6px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

.edit-btn {
    background: #2196F3;
    color: white;
}

.delete-btn {
    background: #f44336;
    color: white;
}

</style>

{% endblock %}
