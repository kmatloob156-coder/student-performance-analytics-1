{% extends "base.html" %}{% block content %}<div class="container"><div class="form"><h2>Add Student</h2><form method="post"><label>Name</label><input name="name" required><label>Roll Number</label><input name="roll" required><label>Semester</label><input name="semester" placeholder="MCA 3rd Semester" required><label>Marks (%)</label><input name="marks" type="number" min="0" max="100" value="70"><label>Attendance (%)</label><input name="attendance" type="number" min="0" max="100" value="80"><label>Technical Skills</label><input name="skills" placeholder="Python, SQL, Excel"><label>Placement Status</label><select name="placement_status"><option>Preparing</option><option>Shortlisted</option><option>Placed</option></select><button class="btn">Save Student</button></form></div></div>{% endblock %}
