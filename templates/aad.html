<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student Record</title>
</head>
<body>
    <h2>Add New Student</h2>

    <form action="/add" method="POST">
        <label>Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label>Roll No:</label><br>
        <input type="text" name="roll" required><br><br>

        <label>Course:</label><br>
        <input type="text" name="course" value="MCA"><br><br>

        <label>Semester:</label><br>
        <input type="text" name="semester"><br><br>

        <label>Marks:</label><br>
        <input type="number" step="0.01" name="marks"><br><br>

        <label>Attendance (%):</label><br>
        <input type="number" step="0.01" name="attendance"><br><br>

        <label>Skills:</label><br>
        <input type="text" name="skills"><br><br>

        <label>Placement Status:</label><br>
        <input type="text" name="placement_status" value="Preparing"><br><br>

        <button type="submit">Submit Record</button>
    </form>

    <br>
    <a href="/">Back to Dashboard</a>
</body>
</html>
