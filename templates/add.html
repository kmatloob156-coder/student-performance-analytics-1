{% extends "base.html" %}{% block content %}
<div class="container"><div class="form"><h1>Add Student</h1>
<form method="post">
<label>Student Name</label><input name="name" required>
<label>Marks (0-100)</label><input name="marks" type="number" min="0" max="100" step="0.1" required>
<label>Attendance % (0-100)</label><input name="attendance" type="number" min="0" max="100" step="0.1" required>
<button class="primary">Save Student</button>
</form></div></div>{% endblock %}
