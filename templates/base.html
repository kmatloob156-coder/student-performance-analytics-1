<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Performance Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
nav{background:#172554;color:#fff;padding:15px 5%;display:flex;justify-content:space-between;align-items:center;gap:10px}
nav b{font-size:18px} nav a{color:#fff;text-decoration:none;margin-left:14px;font-size:14px}
.container{max-width:1100px;margin:25px auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#2563eb,#4338ca);color:#fff;padding:28px;border-radius:18px}
.hero h1{margin-top:0}.btn{display:inline-block;background:#fff;color:#1d4ed8;padding:10px 15px;border-radius:9px;text-decoration:none;border:0;cursor:pointer;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}
.card,.box{background:#fff;padding:18px;border-radius:15px;box-shadow:0 3px 14px #00000010}
.num{font-size:28px;font-weight:bold;margin-top:7px}
.tablebox{background:#fff;padding:16px;border-radius:15px;margin-top:20px;overflow:auto}
table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}
.badge{padding:5px 9px;border-radius:20px;background:#e0e7ff}
.form{background:#fff;padding:22px;border-radius:15px;max-width:650px}
input{width:100%;padding:11px;margin:7px 0 15px;border:1px solid #d7dce5;border-radius:8px}
.primary{background:#2563eb;color:white;padding:11px 16px;border:0;border-radius:9px;cursor:pointer}
.alert{background:#dcfce7;padding:12px;border-radius:9px;margin:15px 0}
.chart{background:#fff;padding:18px;border-radius:15px;margin-top:18px}
.search{display:flex;gap:8px;margin:18px 0}.search input{margin:0}.search button{white-space:nowrap}
@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}nav{display:block}nav div{margin-top:10px}nav a{display:inline-block;margin:4px 8px 0 0}.hero h1{font-size:25px}.search{display:block}.search button{margin-top:8px}}
</style>
</head>
<body>
<nav>
<b>🎓 Student Analytics</b>
<div>
<a href="/">Dashboard</a>
<a href="/students">Students</a>
<a href="/top">Top 5</a>
<a href="/analytics">Analytics</a>
<a href="/add">+ Add</a>
</div>
</nav>
{% with messages=get_flashed_messages() %}
{% if messages %}<div class="container"><div class="alert">{{messages[0]}}</div></div>{% endif %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
