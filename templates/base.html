<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Analytics</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}nav{background:#172554;color:white;padding:16px 5%;display:flex;justify-content:space-between;align-items:center}nav a{color:white;text-decoration:none;margin-left:16px}.container{max-width:1100px;margin:28px auto;padding:0 16px}.hero{background:linear-gradient(135deg,#1d4ed8,#4338ca);color:white;padding:28px;border-radius:18px;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:white;padding:20px;border-radius:15px;box-shadow:0 3px 14px #00000010}.num{font-size:28px;font-weight:bold;margin-top:8px}.btn{display:inline-block;background:#2563eb;color:white;padding:10px 15px;border-radius:9px;text-decoration:none;border:0;cursor:pointer}.tablebox{background:white;padding:16px;border-radius:15px;margin-top:20px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}.form{background:white;padding:22px;border-radius:15px;max-width:650px}input,select{width:100%;padding:11px;margin:7px 0 15px;border:1px solid #ddd;border-radius:8px}.chart{background:white;padding:20px;border-radius:15px;margin-top:20px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}nav{display:block}nav div{margin-top:10px}.hero h1{font-size:25px}}
</style></head><body><nav><b>🎓 Student Analytics</b><div><a href="/">Dashboard</a><a href="/analytics">Analytics</a><a href="/add">+ Add Student</a></div></nav>{% with messages=get_flashed_messages() %}{% if messages %}<div class="container"><b>{{messages[0]}}</b></div>{% endif %}{% endwith %}{% block content %}{% endblock %}</body></html>
